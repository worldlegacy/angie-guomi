# ============================================================
# GitHub Actions: 编译 Angie + Tongsuo（国密版）离线包
# 场景：内网已有 nginx 1.30.2（OpenSSL 1.1.1k）跑在 /app/nginx
#       Angie 装到 /app/angie-guomi（并存不覆盖）
#       配置 100% 兼容原 nginx.conf（Angie 是 nginx fork）
# ============================================================

name: Build Angie with Tongsuo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANGIE_VERSION: "1.12.4"
  TONGSUO_VERSION: "8.5.0"
  # 安装路径：独立目录，不覆盖原 /app/nginx
  PREFIX: "/app/angie-guomi"

jobs:
  build:
    name: Build Angie (x86_64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc g++ make
        sudo apt-get install -y libpcre3 libpcre3-dev zlib1g-dev
        sudo apt-get install -y perl wget curl tar

    - name: 下载源码包
      run: |
        mkdir -p packages build
        cd packages
        if [ ! -f "angie-${ANGIE_VERSION}.tar.gz" ]; then
          wget -c -O angie-${ANGIE_VERSION}.tar.gz \
            "https://download.angie.software/files/angie-${ANGIE_VERSION}.tar.gz" || \
          wget -c -O angie-${ANGIE_VERSION}.tar.gz \
            "https://github.com/webserver-llc/angie/archive/refs/tags/Angie-${ANGIE_VERSION}.tar.gz"
        fi
        if [ ! -f "Tongsuo-${TONGSUO_VERSION}.tar.gz" ]; then
          wget -c -O Tongsuo-${TONGSUO_VERSION}.tar.gz \
            "https://github.com/Tongsuo-Project/Tongsuo/archive/refs/tags/${TONGSUO_VERSION}.tar.gz"
        fi
        ls -lh

    - name: 解压源码
      run: |
        cd build
        tar -xzf ../packages/angie-${ANGIE_VERSION}.tar.gz
        tar -xzf ../packages/Tongsuo-${TONGSUO_VERSION}.tar.gz
        ls -d */

    # ----------------------------------------------------------
    # 编译参数：匹配原 nginx 配置 + 加国密
    # 原 nginx: --prefix=/app/nginx --with-http_ssl_module
    #           --with-file-aio --with-http_realip_module
    #           --with-http_stub_status_module
    # ----------------------------------------------------------
    - name: 编译安装 Angie
      run: |
        cd build
        ANGIE_SRC=$(ls -d angie*/ | head -1 | tr -d '/')
        TONGSUO_SRC=$(ls -d Tongsuo*/ | head -1 | tr -d '/')
        echo "Angie: ${ANGIE_SRC}, Tongsuo: ${TONGSUO_SRC}"
        cd "${ANGIE_SRC}"

        ./configure \
          --prefix="${PREFIX}" \
          --with-openssl="../${TONGSUO_SRC}" \
          --with-openssl-opt="enable-ntls" \
          --with-ntls \
          --with-http_ssl_module \
          --with-stream_ssl_module \
          --with-http_v2_module \
          --with-http_stub_status_module \
          --with-http_realip_module \
          --with-file-aio \
          --with-pcre \
          --with-compat

        make -j$(nproc)
        sudo make install

    - name: 验证编译
      run: |
        echo "=== Angie 版本 ==="
        ${PREFIX}/sbin/angie -v 2>&1
        echo ""
        echo "=== 编译参数 ==="
        ${PREFIX}/sbin/angie -V 2>&1 | head -15
        echo ""
        echo "=== 二进制类型 ==="
        file "${PREFIX}/sbin/angie"

    - name: 打包离线包
      run: |
        OUT="angie-offline-package"
        mkdir -p "${OUT}/config" "${OUT}/scripts"

        # 拷贝编译好的 Angie 到 /app/angie-guomi（独立目录）
        cp -a "${PREFIX}" "${OUT}/angie"

        # 拷贝配置模板
        cp config/*.conf "${OUT}/config/"

        # 拷贝脚本
        cp scripts/install.sh "${OUT}/"
        cp scripts/00-run.sh "${OUT}/scripts/"
        cp scripts/certs/*.sh "${OUT}/scripts/"
        cp scripts/patch-nginx-conf.sh "${OUT}/scripts/" 2>/dev/null || true
        chmod +x "${OUT}/install.sh" "${OUT}/scripts/"*.sh

        tar -czf angie-guomi-offline.tar.gz "${OUT}"
        ls -lh angie-guomi-offline.tar.gz

    - name: 上传 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: angie-guomi-offline-linux-x86_64
        path: angie-guomi-offline.tar.gz
        retention-days: 30
