# ============================================================
# Angie 主配置文件 - 国密方案
# 说明：基于默认 nginx.conf 修改，启用国密支持
# 用法：替换 /usr/local/angie/conf/nginx.conf
# 作者：老王不会写代码
# 日期：2026-10-30
# ============================================================

# ------------------------------------------------------------
# 运行用户
# ------------------------------------------------------------
# user  angie;
worker_processes  auto;

# 日志
error_log  logs/error.log  warn;
# error_log  logs/error.log  notice;

# PID 文件
pid        logs/angie.pid;

# 动态模块加载目录
# load_module modules/ngx_http_brotli_filter_module.so;
# load_module modules/ngx_http_brotli_static_module.so;


events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;  # Linux 下使用 epoll
}


http {
    # --------------------------------------------------------
    # MIME 类型
    # --------------------------------------------------------
    include       mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------
    # 日志格式
    # --------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    # --------------------------------------------------------
    # 性能优化
    # --------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # --------------------------------------------------------
    # Gzip 压缩
    # --------------------------------------------------------
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/xml application/xml+rss application/javascript;
    gzip_min_length 1024;

    # --------------------------------------------------------
    # 默认服务器（HTTP 跳转到 HTTPS）
    # --------------------------------------------------------
    server {
        listen       80 default_server;
        server_name  _;

        # 跳转到 HTTPS
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------
    # 国密配置文件（包含具体的 server 块）
    # --------------------------------------------------------
    include guomi.conf;

    # --------------------------------------------------------
    # 其他配置文件
    # --------------------------------------------------------
    # include vhost/*.conf;
}


