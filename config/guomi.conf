# ============================================================
# Angie 国密配置 - 示例服务
# 功能：支持国密 NTLS + 兼容 RSA（同时支持国密客户端和普通客户端）
# 用法：将此文件 include 到 nginx.conf 的 http 块中
# 作者：老王不会写代码
# 日期：2026-10-30
# ============================================================

# ------------------------------------------------------------
# 示例 1：国密 + RSA 双证书混合模式（推荐生产环境使用）
# Angie 会根据客户端能力自动选择国密或 RSA 加密
# ------------------------------------------------------------
server {
    listen      443 ssl;
    server_name guomi.example.com;  # TODO: 替换为实际域名

    # --------------------------------------------------------
    # 国密 NTLS 启用
    # --------------------------------------------------------
    ssl_ntls on;

    # --------------------------------------------------------
    # 国密 SM2 双证书配置
    # 顺序：第一个是签名证书，第二个是加密证书
    # --------------------------------------------------------
    ssl_certificate      cert/sm2/server_sign.crt cert/sm2/server_enc.crt;
    ssl_certificate_key  cert/sm2/server_sign.key cert/sm2/server_enc.key;

    # --------------------------------------------------------
    # RSA 证书（用于兼容非国密客户端）
    # 注意：如果不配 RSA 证书，只有国密客户端能连接
    # --------------------------------------------------------
    ssl_certificate      cert/rsa/server_rsa.crt;
    ssl_certificate_key  cert/rsa/server_rsa.key;

    # --------------------------------------------------------
    # 证书链（可选，用于客户端验证）
    # --------------------------------------------------------
    # ssl_trusted_certificate cert/ca-chain.crt;

    # --------------------------------------------------------
    # TLS 协议版本
    # --------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;

    # --------------------------------------------------------
    # 密码套件（必须包含国密套件）
    # 国密 NTLS 套件：
    #   ECC-SM2-SM4-CBC-SM3     - 静态 ECC 密钥交换
    #   ECDHE-SM2-WITH-SM4-SM3  - 临时 ECC 密钥交换（推荐）
    # TLSv1.3 国密套件（RFC 8998）：
    #   TLS_SM4_GCM_SM3 / TLS_SM4_CCM_SM3
    # --------------------------------------------------------
    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # --------------------------------------------------------
    # TLS 会话缓存
    # --------------------------------------------------------
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_session_tickets  off;

    # --------------------------------------------------------
    # 其他 TLS 优化
    # --------------------------------------------------------
    ssl_stapling            on;
    ssl_stapling_verify     on;
    # resolver  8.8.8.8 8.8.4.4 valid=300s;  # TODO: 配置 DNS 解析器
    # resolver_timeout 5s;

    # --------------------------------------------------------
    # HTTP/2（可选）
    # --------------------------------------------------------
    listen 443 ssl http2;

    # --------------------------------------------------------
    # 网站根目录
    # --------------------------------------------------------
    root   html/guomi;
    index  index.html index.htm;

    # --------------------------------------------------------
    # 日志
    # --------------------------------------------------------
    access_log  logs/guomi_access.log;
    error_log   logs/guomi_error.log warn;

    # --------------------------------------------------------
    # 健康检查接口（国密客户端专用）
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # --------------------------------------------------------
    # API 代理示例（国密回源）
    # --------------------------------------------------------
    location /api/ {
        # 国密回源配置（如果后端也使用国密）
        proxy_ssl_ntls  on;
        proxy_ssl_certificate      cert/sm2/server_sign.crt cert/sm2/server_enc.crt;
        proxy_ssl_certificate_key  cert/sm2/server_sign.key cert/sm2/server_enc.key;
        proxy_ssl_ciphers "ECC-SM2-WITH-SM4-SM3:ECDHE-SM2-WITH-SM4-SM3:RSA";

        # 普通回源（后端用普通 TLS）
        # proxy_pass https://backend.example.com/api/;

        # 国密回源（后端也支持国密）
        proxy_pass https://backend-gm.example.com/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ============================================================
# 示例 2：纯国密模式（仅支持国密客户端）
# 不配置 RSA 证书，只有支持国密的客户端能连接
# 适用于内部系统、专网等场景
# ============================================================
server {
    listen      443 ssl;
    server_name gm-only.example.com;

    # 启用国密 NTLS
    ssl_ntls on;

    # 仅配置国密双证书
    ssl_certificate      cert/sm2/server_sign.crt cert/sm2/server_enc.crt;
    ssl_certificate_key  cert/sm2/server_sign.key cert/sm2/server_enc.key;

    # 国密密码套件
    ssl_protocols TLSv1.2;
    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3;
    ssl_prefer_server_ciphers on;

    # 会话缓存
    ssl_session_cache    shared:GM_SSL:10m;
    ssl_session_timeout  10m;

    root   html/gm-only;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}


# ============================================================
# 示例 3：HTTP 自动跳转 HTTPS
# ============================================================
server {
    listen  80;
    server_name guomi.example.com;

    # 全部跳转到 HTTPS
    return 301 https://$host$request_uri;
}


