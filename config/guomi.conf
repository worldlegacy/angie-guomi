# ============================================================
# Angie 国密配置模板（最小改动版）
# 场景：已有 nginx 1.30.2 + OpenSSL 配置，要在其上叠加国密
#
# 用法：把下面 # ===国密新增=== 区域内的内容
#       复制到原 nginx.conf 的 server {} 块里
#       其他配置原封不动保留！
#
# 核心逻辑：
#   - ssl_ntls on → 开启国密 NTLS 协议
#   - ssl_certificate → 支持多个证书（国密 + RSA 混合）
#   - ssl_ciphers → 加国密套件，Angie 会自动根据客户端能力选择
# ============================================================

# ------------------------------------------------------------
# 原 nginx.conf 大概长这样（节选）：
# ------------------------------------------------------------
# server {
#     listen 443 ssl;
#     server_name your-domain.com;
#
#     ssl_certificate     /app/nginx/conf/server.pem;
#     ssl_certificate_key /app/nginx/conf/server.key;
#
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:...;
#     ssl_session_cache shared:SSL:10m;
#     ...（其他 location、proxy_pass 等）...
# }
#
# ------------------------------------------------------------
# 改成 Angie 国密版后（只加这几行，其他原封不动）：
# ------------------------------------------------------------

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # ====================== 国密新增（从这里开始）======================
    
    # 1. 开启国密 NTLS 协议（就这一行！）
    ssl_ntls on;

    # 2. 国密 SM2 双证书（签名证书 + 加密证书，顺序不能反）
    ssl_certificate      /app/angie-guomi/conf/cert/sm2/server_sign.crt
                         /app/angie-guomi/conf/cert/sm2/server_enc.crt;
    ssl_certificate_key  /app/angie-guomi/conf/cert/sm2/server_sign.key
                         /app/angie-guomi/conf/cert/sm2/server_enc.key;

    # 3. RSA 证书（原来的，保留！Angie 自动识别混合证书）
    ssl_certificate      /app/nginx/conf/server.pem;
    ssl_certificate_key  /app/nginx/conf/server.key;

    # 4. 国密密码套件（加在原 ssl_ciphers 前面，Angie 会自动协商）
    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:
                ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:
                DHE-RSA-AES128-GCM-SHA256;

    # ====================== 国密新增（到这里结束）======================

    # 5. 以下配置全部原样保留！！！
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_session_tickets  off;

    # ... 原有的 location / proxy_pass / root 等全部保留 ...
}


# ============================================================
# 说明
# ============================================================
# Q: 为什么 ssl_certificate 写了两次？
# A: Angie 支持混合证书：先写国密双证书，再写 RSA 单证书。
#    Angie 会自动探测客户端能力：
#    - 国密客户端（红莲花/360国密版/密信等）→ 用 SM2 证书 + NTLS 协议
#    - 普通浏览器（Chrome/FF/Edge）→ 用 RSA 证书 + TLS 1.2/1.3
#
# Q: 为什么 nginx.conf 不直接整个替换？
# A: Angie 是 nginx fork，配置 100% 兼容。
#    但保留原有配置更安全，只需加国密那几行就行。
#
# Q: 国密客户端有哪些？
# A: 红莲花浏览器（国密版）、360 安全浏览器（国密版）、
#    密信浏览器、奇安信国密浏览器等
#
# Q: 怎么测试国密是否生效？
# A:
#   # 用 Tongsuo 编译的 openssl 测试国密握手
#   /app/angie-guomi/openssl/bin/openssl s_client \
#     -connect 你的域名:443 \
#     -cipher ECDHE-SM2-WITH-SM4-SM3 \
#     -enable_ntls -ntls
#   看到 Verify return code: 0 (ok) 就说明国密通了
